<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 424" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="title">jev-router in Claude Code: where the requests went, and what the work cost</title>
  <desc id="desc">26 sessions and 1,611 requests. Haiku 9.6%, Sonnet 76.9%, Opus at high effort 4.5%, Opus at xhigh effort 9.0%. List-price cost: always Opus at xhigh $166, best model per session $147, jev-router $141, which is 15% less than always Opus.</desc>
  <style>
    .bg { fill: #fcfcfb; }
    .t1 { fill: #0b0b0b; }
    .t2 { fill: #52514e; }
    .tm { fill: #898781; }
    .axis { stroke: #c3c2b7; }
    .r1 { fill: #86b6ef; }
    .r2 { fill: #3987e5; }
    .r3 { fill: #1c5cab; }
    .r4 { fill: #0d366b; }
    .grey { fill: #898781; }
    .acc { fill: #2a78d6; }
    .good { fill: #006300; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1a19; }
      .t1 { fill: #ffffff; }
      .t2 { fill: #c3c2b7; }
      .axis { stroke: #383835; }
      .r1 { fill: #184f95; }
      .r2 { fill: #2a78d6; }
      .r3 { fill: #6da7ec; }
      .r4 { fill: #b7d3f6; }
      .grey { fill: #6b6a65; }
      .acc { fill: #3987e5; }
      .good { fill: #0ca30c; }
    }
  </style>

  <rect class="bg" width="720" height="424" rx="8"/>
  <text class="t1" x="24" y="36" font-size="18" font-weight="700">jev-router in Claude Code: one day of real work</text>
  <text class="tm" x="24" y="58" font-size="13">26 sessions · 1,611 requests · 2026-09-23 to 2026-09-24</text>

  <text class="t2" x="24" y="94" font-size="12" font-weight="600" letter-spacing="0.4">WHERE THE REQUESTS WENT</text>
  <line class="axis" x1="232" y1="104" x2="232" y2="216" stroke-width="1"/>

  <text class="t2" x="220" y="123" font-size="13" text-anchor="end">Haiku · micro</text>
  <rect class="r1" x="232" y="108" width="40.3" height="20" rx="3"/>
  <text class="t1" x="280" y="123" font-size="13" font-weight="600">9.6%</text>

  <text class="t2" x="220" y="151" font-size="13" text-anchor="end">Sonnet · low</text>
  <rect class="r2" x="232" y="136" width="323" height="20" rx="3"/>
  <text class="t1" x="563" y="151" font-size="13" font-weight="600">76.9%</text>

  <text class="t2" x="220" y="179" font-size="13" text-anchor="end">Opus, high effort · medium</text>
  <rect class="r3" x="232" y="164" width="18.9" height="20" rx="3"/>
  <text class="t1" x="259" y="179" font-size="13" font-weight="600">4.5%</text>

  <text class="t2" x="220" y="207" font-size="13" text-anchor="end">Opus, xhigh effort · high</text>
  <rect class="r4" x="232" y="192" width="37.8" height="20" rx="3"/>
  <text class="t1" x="278" y="207" font-size="13" font-weight="600">9.0%</text>

  <text class="t2" x="24" y="260" font-size="12" font-weight="600" letter-spacing="0.4">COST OF THE SAME WORK, AT LIST PRICES</text>
  <line class="axis" x1="232" y1="270" x2="232" y2="354" stroke-width="1"/>

  <text class="t2" x="220" y="289" font-size="13" text-anchor="end">Always Opus at xhigh</text>
  <rect class="grey" x="232" y="274" width="410" height="20" rx="3"/>
  <text class="t1" x="650" y="289" font-size="13" font-weight="600">$166</text>

  <text class="t2" x="220" y="317" font-size="13" text-anchor="end">Best model per session</text>
  <rect class="grey" x="232" y="302" width="361.4" height="20" rx="3"/>
  <text class="t1" x="601" y="317" font-size="13" font-weight="600">$147</text>

  <text class="t1" x="220" y="345" font-size="13" font-weight="700" text-anchor="end">jev-router</text>
  <rect class="acc" x="232" y="330" width="346.6" height="20" rx="3"/>
  <text class="t1" x="586" y="345" font-size="13" font-weight="600">$141</text>
  <text class="good" x="624" y="345" font-size="13" font-weight="600">−15%</text>

  <text class="tm" x="24" y="388" font-size="12">Lower bound: the baselines keep the output tokens of the router. A stronger route writes more.</text>
  <text class="tm" x="24" y="406" font-size="12">Method, table and the Pi numbers: docs/evaluation.md</text>
</svg>
