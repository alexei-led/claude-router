<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 1104" role="img" aria-labelledby="title desc">
  <title id="title">Router pane, Routing tab</title>
  <desc id="desc">Model and effort per tier with prices and windows, the baseline tier, how the policy prices each step up, the activity matrix and overrides, the policy controls, and the unsaved router.json changes with Save and Discard.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; }
    .cap { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 12px; fill: #9a988f; }
  </style>
  <rect width="828" height="1104" rx="8" fill="#1c1c1c"/>
<rect x="10" y="10" width="808" height="1084" rx="6" fill="none" stroke="#3f5f8f"/>
<text x="24.0" y="34" fill="#5fafd7" font-weight="700" xml:space="preserve">ROUTING</text>
<rect x="94.2" y="20" width="62.4" height="18" rx="4" fill="#87afff"/>
<text x="94.2" y="34" fill="#0d1016" font-weight="700" xml:space="preserve">[ ◉ on ]</text>
<rect x="164.4" y="20" width="70.2" height="18" rx="4" fill="#2e3340"/>
<text x="164.4" y="34" fill="#d0d0d0" xml:space="preserve">[ ○ off ]</text>
<text x="234.6" y="34" fill="#7c7c7c" xml:space="preserve">  off keeps the /model choice</text>
<text x="24.0" y="53" fill="#87d787" xml:space="preserve">Jev ready · 347 ms</text>
<rect x="24.0" y="58" width="54.6" height="18" rx="4" fill="#2e3340"/>
<text x="24.0" y="72" fill="#d0d0d0" xml:space="preserve">[ Now ]</text>
<rect x="86.4" y="58" width="101.4" height="18" rx="4" fill="#87afff"/>
<text x="86.4" y="72" fill="#0d1016" font-weight="700" xml:space="preserve">[ Routing ● ]</text>
<rect x="195.6" y="58" width="109.2" height="18" rx="4" fill="#2e3340"/>
<text x="195.6" y="72" fill="#d0d0d0" xml:space="preserve">[ Classifier ]</text>
<rect x="312.6" y="58" width="70.2" height="18" rx="4" fill="#2e3340"/>
<text x="312.6" y="72" fill="#d0d0d0" xml:space="preserve">[ Usage ]</text>
<rect x="390.6" y="58" width="39.0" height="18" rx="4" fill="#2e3340"/>
<text x="390.6" y="72" fill="#d0d0d0" xml:space="preserve">[ ? ]</text>
<text x="24.0" y="110" fill="#5fafd7" font-weight="700" xml:space="preserve">ROUTES</text>
<text x="70.8" y="110" fill="#7c7c7c" xml:space="preserve"> · applies next turn · edit, then Save</text>
<text x="24.0" y="129" fill="#7c7c7c" xml:space="preserve">tier    model         effort        $/M in · out  window</text>
<text x="24.0" y="148" fill="#e0708a" font-weight="700" xml:space="preserve">high</text>
<text x="86.4" y="148" fill="#d0d0d0" xml:space="preserve">Opus 5.5 ▾</text>
<text x="195.6" y="148" fill="#d0d0d0" xml:space="preserve">xhigh ▾</text>
<text x="304.8" y="148" fill="#d0d0d0" xml:space="preserve">4 · 20</text>
<text x="414.0" y="148" fill="#d0d0d0" xml:space="preserve">1M</text>
<text x="24.0" y="167" fill="#d7af5f" font-weight="700" xml:space="preserve">medium</text>
<text x="86.4" y="167" fill="#d0d0d0" xml:space="preserve">Sonnet 5.5 ▾</text>
<text x="195.6" y="167" fill="#d0d0d0" xml:space="preserve">xhigh ▾</text>
<text x="289.2" y="167" fill="#d7af5f" xml:space="preserve">●</text>
<text x="304.8" y="167" fill="#d0d0d0" xml:space="preserve">2 · 10</text>
<text x="414.0" y="167" fill="#d0d0d0" xml:space="preserve">1M</text>
<text x="24.0" y="186" fill="#5f9fe0" font-weight="700" xml:space="preserve">low</text>
<text x="86.4" y="186" fill="#d0d0d0" xml:space="preserve">Haiku 5.5 ▾</text>
<text x="195.6" y="186" fill="#d0d0d0" xml:space="preserve">high ▾</text>
<text x="304.8" y="186" fill="#d0d0d0" xml:space="preserve">0.1 · 0.5</text>
<text x="414.0" y="186" fill="#d0d0d0" xml:space="preserve">1M</text>
<text x="24.0" y="205" fill="#5fd7af" font-weight="700" xml:space="preserve">micro</text>
<text x="86.4" y="205" fill="#d0d0d0" xml:space="preserve">Haiku 5.5 ▾</text>
<text x="195.6" y="205" fill="#d0d0d0" xml:space="preserve">medium ▾</text>
<text x="304.8" y="205" fill="#d0d0d0" xml:space="preserve">0.1 · 0.5</text>
<text x="414.0" y="205" fill="#d0d0d0" xml:space="preserve">1M</text>
<text x="24.0" y="224" fill="#d0d0d0" xml:space="preserve">Baseline tier: low ▾</text>
<text x="304.8" y="224" fill="#7c7c7c" xml:space="preserve">start here, fall back here</text>
<text x="24.0" y="262" fill="#5fafd7" font-weight="700" xml:space="preserve">SWITCH COST · from these routes</text>
<text x="24.0" y="281" fill="#7c7c7c" xml:space="preserve">· </text>
<text x="39.6" y="281" fill="#d0d0d0" xml:space="preserve">medium → high   </text>
<text x="164.4" y="281" fill="#d0d0d0" xml:space="preserve">model change: priced as a cold cache write</text>
<text x="24.0" y="300" fill="#7c7c7c" xml:space="preserve">· </text>
<text x="39.6" y="300" fill="#d0d0d0" xml:space="preserve">low → medium    </text>
<text x="164.4" y="300" fill="#d0d0d0" xml:space="preserve">model change: priced as a cold cache write</text>
<text x="24.0" y="319" fill="#7c7c7c" xml:space="preserve">· </text>
<text x="39.6" y="319" fill="#d0d0d0" xml:space="preserve">micro → low     </text>
<text x="164.4" y="319" fill="#d0d0d0" xml:space="preserve">same model, new effort: priced as a new cache</text>
<rect x="24.0" y="324" width="218.4" height="18" rx="4" fill="#2e3340"/>
<text x="24.0" y="338" fill="#d0d0d0" xml:space="preserve">[ Reset routes to defaults ]</text>
<text x="24.0" y="357" fill="#7c7c7c" xml:space="preserve">A new model ID needs router.json → models: price, window, efforts.</text>
<text x="24.0" y="395" fill="#5fafd7" font-weight="700" xml:space="preserve">ACTIVITIES</text>
<text x="102.0" y="395" fill="#7c7c7c" xml:space="preserve"> · applies next turn · edit, then Save</text>
<text x="24.0" y="414" fill="#d0d0d0" xml:space="preserve">Activity routing: on ▾</text>
<text x="242.4" y="414" fill="#7c7c7c" xml:space="preserve">an override runs when the activity has one</text>
<text x="273.6" y="433" fill="#7c7c7c" xml:space="preserve">micro    low      medium   high     </text>
<text x="24.0" y="452" fill="#d0d0d0" xml:space="preserve">  base                          H·med    H·high   S·xh     O·xh     </text>
<text x="24.0" y="471" fill="#d0d0d0" xml:space="preserve">  code                          ·        S·high   ·        O·max    </text>
<text x="24.0" y="490" fill="#d0d0d0" xml:space="preserve">  debug plan review             ·        S·high   ·        ·        </text>
<text x="24.0" y="509" fill="#d0d0d0" xml:space="preserve">  explore docs                  ·        ·        ·        ·        </text>
<text x="24.0" y="528" fill="#d0d0d0" xml:space="preserve">  ops                           ·        ·        H·high   ·        </text>
<text x="24.0" y="547" fill="#7c7c7c" xml:space="preserve">  6 distinct routes = 6 caches</text>
<text x="24.0" y="585" fill="#5fafd7" font-weight="700" xml:space="preserve">OVERRIDES</text>
<text x="94.2" y="585" fill="#7c7c7c" xml:space="preserve"> · in use</text>
<text x="24.0" y="604" fill="#d0d0d0" xml:space="preserve">code</text>
<text x="102.0" y="604" fill="#5f9fe0" font-weight="700" xml:space="preserve">low</text>
<text x="164.4" y="604" fill="#d0d0d0" xml:space="preserve">Sonnet 5.5 ▾</text>
<text x="273.6" y="604" fill="#d0d0d0" xml:space="preserve">high ▾</text>
<rect x="382.8" y="590" width="78.0" height="18" rx="4" fill="#2e3340"/>
<text x="382.8" y="604" fill="#d0d0d0" xml:space="preserve">[ remove ]</text>
<text x="24.0" y="623" fill="#d0d0d0" xml:space="preserve">code</text>
<text x="102.0" y="623" fill="#e0708a" font-weight="700" xml:space="preserve">high</text>
<text x="164.4" y="623" fill="#d0d0d0" xml:space="preserve">Opus 5.5 ▾</text>
<text x="273.6" y="623" fill="#d0d0d0" xml:space="preserve">max ▾</text>
<text x="367.2" y="623" fill="#d7af5f" xml:space="preserve">●</text>
<rect x="382.8" y="609" width="78.0" height="18" rx="4" fill="#2e3340"/>
<text x="382.8" y="623" fill="#d0d0d0" xml:space="preserve">[ remove ]</text>
<text x="460.8" y="623" fill="#d7af5f" xml:space="preserve">  new (model, effort) pair: one more cache</text>
<text x="24.0" y="642" fill="#d0d0d0" xml:space="preserve">debug</text>
<text x="102.0" y="642" fill="#5f9fe0" font-weight="700" xml:space="preserve">low</text>
<text x="164.4" y="642" fill="#d0d0d0" xml:space="preserve">Sonnet 5.5 ▾</text>
<text x="273.6" y="642" fill="#d0d0d0" xml:space="preserve">high ▾</text>
<rect x="382.8" y="628" width="78.0" height="18" rx="4" fill="#2e3340"/>
<text x="382.8" y="642" fill="#d0d0d0" xml:space="preserve">[ remove ]</text>
<text x="24.0" y="661" fill="#d0d0d0" xml:space="preserve">plan</text>
<text x="102.0" y="661" fill="#5f9fe0" font-weight="700" xml:space="preserve">low</text>
<text x="164.4" y="661" fill="#d0d0d0" xml:space="preserve">Sonnet 5.5 ▾</text>
<text x="273.6" y="661" fill="#d0d0d0" xml:space="preserve">high ▾</text>
<rect x="382.8" y="647" width="78.0" height="18" rx="4" fill="#2e3340"/>
<text x="382.8" y="661" fill="#d0d0d0" xml:space="preserve">[ remove ]</text>
<text x="24.0" y="680" fill="#d0d0d0" xml:space="preserve">review</text>
<text x="102.0" y="680" fill="#5f9fe0" font-weight="700" xml:space="preserve">low</text>
<text x="164.4" y="680" fill="#d0d0d0" xml:space="preserve">Sonnet 5.5 ▾</text>
<text x="273.6" y="680" fill="#d0d0d0" xml:space="preserve">high ▾</text>
<rect x="382.8" y="666" width="78.0" height="18" rx="4" fill="#2e3340"/>
<text x="382.8" y="680" fill="#d0d0d0" xml:space="preserve">[ remove ]</text>
<text x="24.0" y="699" fill="#d0d0d0" xml:space="preserve">ops</text>
<text x="102.0" y="699" fill="#d7af5f" font-weight="700" xml:space="preserve">medium</text>
<text x="164.4" y="699" fill="#d0d0d0" xml:space="preserve">Haiku 5.5 ▾</text>
<text x="273.6" y="699" fill="#d0d0d0" xml:space="preserve">high ▾</text>
<rect x="382.8" y="685" width="78.0" height="18" rx="4" fill="#2e3340"/>
<text x="382.8" y="699" fill="#d0d0d0" xml:space="preserve">[ remove ]</text>
<text x="24.0" y="718" fill="#d0d0d0" xml:space="preserve">add an override… ▾</text>
<text x="24.0" y="756" fill="#5fafd7" font-weight="700" xml:space="preserve">POLICY</text>
<text x="70.8" y="756" fill="#7c7c7c" xml:space="preserve"> · applies next turn · edit, then Save</text>
<text x="24.0" y="775" fill="#d0d0d0" xml:space="preserve">Votes to go down</text>
<text x="180.0" y="775" fill="#d0d0d0" xml:space="preserve">2 ▾</text>
<text x="289.2" y="775" fill="#7c7c7c" xml:space="preserve">agreeing turns before cheaper</text>
<text x="24.0" y="794" fill="#d0d0d0" xml:space="preserve">Payback horizon</text>
<text x="180.0" y="794" fill="#d0d0d0" xml:space="preserve">5 turns ▾</text>
<text x="289.2" y="794" fill="#7c7c7c" xml:space="preserve">a switch repays its cache</text>
<text x="24.0" y="813" fill="#d0d0d0" xml:space="preserve">Credits cap</text>
<text x="180.0" y="813" fill="#d0d0d0" xml:space="preserve">$2.00 ▾</text>
<text x="289.2" y="813" fill="#7c7c7c" xml:space="preserve">max cold write on credits</text>
<text x="24.0" y="832" fill="#d0d0d0" xml:space="preserve">Activity threshold</text>
<text x="180.0" y="832" fill="#d0d0d0" xml:space="preserve">60% ▾</text>
<text x="289.2" y="832" fill="#7c7c7c" xml:space="preserve">a weaker reading keeps the running activity or uses the base route</text>
<rect x="24.0" y="837" width="218.4" height="18" rx="4" fill="#2e3340"/>
<text x="24.0" y="851" fill="#d0d0d0" xml:space="preserve">[ Reset policy to defaults ]</text>
<text x="24.0" y="889" fill="#5fafd7" font-weight="700" xml:space="preserve">CONFIG</text>
<text x="24.0" y="908" fill="#d0d0d0" xml:space="preserve">File     ~/.claude/router.json  </text>
<rect x="273.6" y="894" width="62.4" height="18" rx="4" fill="#2e3340"/>
<text x="273.6" y="908" fill="#d0d0d0" xml:space="preserve">[ copy ]</text>
<text x="24.0" y="927" fill="#7c7c7c" xml:space="preserve">Main conversation only. Subagents keep their own model.</text>
<text x="24.0" y="965" fill="#7c7c7c" xml:space="preserve">router.json changes:</text>
<text x="24.0" y="984" fill="#e06c6c" xml:space="preserve">- routes.medium                  Opus 5.5 · medium</text>
<text x="24.0" y="1003" fill="#87d787" xml:space="preserve">+ routes.medium                  Sonnet 5.5 · xhigh</text>
<text x="24.0" y="1022" fill="#e06c6c" xml:space="preserve">- activities.code.high           no override</text>
<text x="24.0" y="1041" fill="#87d787" xml:space="preserve">+ activities.code.high           Opus 5.5 · max</text>
<text x="24.0" y="1060" fill="#d7af5f" xml:space="preserve">● 2 unsaved routing changes  </text>
<rect x="250.2" y="1046" width="62.4" height="18" rx="4" fill="#87afff"/>
<text x="250.2" y="1060" fill="#0d1016" font-weight="700" xml:space="preserve">[ Save ]</text>
<rect x="320.4" y="1046" width="85.8" height="18" rx="4" fill="#2e3340"/>
<text x="320.4" y="1060" fill="#d0d0d0" xml:space="preserve">[ Discard ]</text>
<rect x="24.0" y="1065" width="70.2" height="18" rx="4" fill="#2e3340"/>
<text x="24.0" y="1079" fill="#d0d0d0" xml:space="preserve">[ Close ]</text>
