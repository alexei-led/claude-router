<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 922 593" role="img" aria-labelledby="title desc">
  <title id="title">The Router band above the Claude Code prompt</title>
  <desc id="desc">Eight band states drawn by the router code: routed to high, two rows on a Claude plan with the hover row, two rows on an API key, a pending pin, a missing classifier key, routing off, an activity move with activity routing on, and cost mode set for the session.</desc>
