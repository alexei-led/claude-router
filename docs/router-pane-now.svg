<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 922 610" role="img" aria-labelledby="title desc">
  <title id="title">Router pane, Now tab</title>
  <desc id="desc">Each block in a single-line box. NEXT TURN: the tier meter, model and activity, the reason with the classifier support it weighed and the switch cost, and the dropdown that pins the next turn to a tier. PLAN: the 5-hour and 7-day windows with their resets. SESSION: the total of the main thread and one running subagent as a configured-rate API estimate, the difference against unrouted, the main thread and the subagents as bars on one scale, and a strip of every reply colored by tier with the replies per tier. CONTEXT: the window fill and the cache reuse.</desc>
