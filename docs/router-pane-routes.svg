<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 657 686" role="img" aria-labelledby="title desc">
  <title id="title">Router pane, Routes tab</title>
  <desc id="desc">The activity routing mode, then one grid of tiers by activities: the tiers’ own models on top, each activity override in its cell with built-in defaults marked °, unsaved edits ●; the editor of the selected cell, coding at high, with Use tier model; the model setups in use; and the unsaved router.json changes with Save and Discard.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; }
    .cap { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 12px; fill: #9a988f; }
  </style>
  <rect width="657" height="686" rx="8" fill="#1c1c1c"/>
<rect x="10" y="10" width="637" height="666" rx="6" fill="none" stroke="#3f5f8f"/>
