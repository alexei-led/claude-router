<rect x="195.6" y="381" width="280.8" height="18" rx="4" fill="#2e3340"/>
<text x="195.6" y="395" fill="#d0d0d0" xml:space="preserve">[ Use tier model: Opus 5.5 · xhigh ]</text>
<text x="24.0" y="414" fill="#d7af5f" xml:space="preserve">                      ! a model setup only this cell uses: one more cache</text>
<text x="24.0" y="452" fill="#7c7c7c" xml:space="preserve">6 model setups in use. Each setup (model + effort) keeps its own prompt cache;</text>
<text x="24.0" y="471" fill="#7c7c7c" xml:space="preserve">a switch to a cold one writes the whole context again, the switch cost on Now.</text>
<rect x="24.0" y="476" width="218.4" height="18" rx="4" fill="#2e3340"/>
<text x="24.0" y="490" fill="#d0d0d0" xml:space="preserve">[ Reset routes to defaults ]</text>
<text x="24.0" y="509" fill="#7c7c7c" xml:space="preserve">A new model ID needs router.json → models: price, window, efforts.</text>
