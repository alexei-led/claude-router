name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CLAUDE_CODE_VERSION: 2.1.289
  DISABLE_AUTOUPDATER: 1

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint, formatting, and imports
        run: npm run check
      - name: Test
        run: npm test
      - name: Package dry run
        run: npm run pack:dry
      # The engine loads the hooks module the way a session does and refuses what lint and unit tests miss,
      # such as a binding that shadows the hook's `next`. The version is the oldest one the router supports.
      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Validate plugin and marketplace
        run: npm run validate
      - name: Mod tests in the Claude Code engine
        run: npm run test:plugin
