name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  id-token: write

env:
  CLAUDE_CODE_VERSION: 2.1.289
  DISABLE_AUTOUPDATER: 1

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify signed release tag
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const { owner, repo } = context.repo;
            const { data: ref } = await github.rest.git.getRef({
              owner,
              repo,
              ref: `tags/${tag}`,
            });

            if (ref.object.type !== "tag") {
              core.setFailed(`Tag ${tag} must be an annotated, signed tag.`);
              return;
            }

            const { data: tagObject } = await github.rest.git.getTag({
              owner,
              repo,
              tag_sha: ref.object.sha,
            });

            if (!tagObject.verification?.verified) {
              const reason = tagObject.verification?.reason ?? "unknown";
              core.setFailed(`Tag ${tag} has no verified signature: ${reason}.`);
              return;
            }

            if (tagObject.object.type !== "commit" || tagObject.object.sha !== context.sha) {
              core.setFailed(`Tag ${tag} must point directly to release commit ${context.sha}.`);
            }
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify npm trusted publishing support
        run: |
          npm_version="$(npm --version)"
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1);' "$npm_version"
          printf 'npm %s supports trusted publishing.\n' "$npm_version"
      - name: Read release metadata
        id: metadata
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const tag = process.env.GITHUB_REF_NAME;
            const expectedTag = `v${pkg.version}`;

            if (tag !== expectedTag) {
              core.setFailed(`Tag ${tag} does not match package.json version ${expectedTag}.`);
              return;
            }

            // The reviewed CHANGELOG section is the release notes: `## <version> (<date>)` up to the next `## `.
            // Checked here, before npm publication, so a missing section cannot leave a release half done.
            const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
            const heading = new RegExp(`^## ${pkg.version.replaceAll(".", "\\.")} \\(\\d{4}-\\d{2}-\\d{2}\\)$`, "m");
            const start = changelog.search(heading);
            if (start === -1) {
              core.setFailed(`CHANGELOG.md has no dated section for ${pkg.version}.`);
              return;
            }
            const section = changelog.slice(start).split("\n").slice(1);
            const end = section.findIndex((line) => line.startsWith("## "));
            const notes = (end === -1 ? section : section.slice(0, end)).join("\n").trim();
            if (!notes) {
              core.setFailed(`CHANGELOG.md section for ${pkg.version} is empty.`);
              return;
            }

            core.setOutput("notes", notes);
            core.setOutput("name", pkg.name);
            core.setOutput("version", pkg.version);
            core.setOutput("tag", tag);
            core.setOutput("release_name", tag);
            core.setOutput("prerelease", String(pkg.version.includes("-")));
      - name: Ensure tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Tag $GITHUB_REF_NAME must point to a commit on main." >&2
            exit 1
          }
      - name: Install dependencies
        run: npm ci --prefix tools --ignore-scripts
      - name: Lint, formatting, imports, and typecheck
        run: |
          npm run check
          npm run typecheck
      - name: Test
        run: npm test
      - name: Package dry run
        run: npm run pack:dry
      # The engine loads the hooks module the way a session does and refuses what lint and unit tests miss,
      # such as a binding that shadows the hook's `next`. The version is the oldest one the router supports.
      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Validate plugin and marketplace
        run: npm run validate
      - name: Mod tests in the Claude Code engine
        run: npm run test:plugin
      - name: Check npm package version
        id: npm
        env:
          PACKAGE_NAME: ${{ steps.metadata.outputs.name }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          metadata="$(mktemp)"
          trap 'rm -f "$metadata"' EXIT
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --json >"$metadata"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            # Only a missing version permits publication; auth/network failures stop here.
            node -e 'const fs = require("node:fs"); const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (data.error?.code !== "E404") process.exit(1);' "$metadata"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        id: publish
        if: steps.npm.outputs.published == 'false'
        env:
          PACKAGE_NAME: ${{ steps.metadata.outputs.name }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          if npm publish --provenance --access public; then
            echo "result=published" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "Publish command returned non-zero, but $PACKAGE_NAME@$PACKAGE_VERSION is now on npm; continuing." >&2
            echo "result=already-visible-after-publish" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          exit 1
      - name: Create GitHub release
        id: release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PACKAGE_NAME: ${{ steps.metadata.outputs.name }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_NAME: ${{ steps.metadata.outputs.release_name }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
          RELEASE_NOTES: ${{ steps.metadata.outputs.notes }}
        with:
          script: |
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
            const tag = process.env.RELEASE_TAG;
            const version = process.env.PACKAGE_VERSION;
            const notes = process.env.RELEASE_NOTES;
            const body = [
              notes,
              "",
              "## Package",
              `- Name: \`${process.env.PACKAGE_NAME}\``,
              `- Version: \`${version}\``,
              `- Tag: \`${tag}\``,
              `- Commit: \`${process.env.GITHUB_SHA}\``,
            ].join("\n");

            try {
              const { data: existing } = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });
              core.info(`Release already exists: ${existing.html_url}`);
              core.setOutput("created", "false");
              core.setOutput("url", existing.html_url);
              return;
            } catch (error) {
              if (error?.status !== 404) throw error;
            }

            const { data: release } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: process.env.GITHUB_SHA,
              name: process.env.RELEASE_NAME,
              body,
              prerelease: process.env.PRERELEASE === "true",
              make_latest: process.env.PRERELEASE === "true" ? "false" : "true",
            });

            core.setOutput("created", "true");
            core.setOutput("url", release.html_url);
      - name: Release summary
        env:
          PACKAGE_NAME: ${{ steps.metadata.outputs.name }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          NPM_ALREADY_PUBLISHED: ${{ steps.npm.outputs.published }}
          NPM_PUBLISH_RESULT: ${{ steps.publish.outputs.result }}
          GH_RELEASE_CREATED: ${{ steps.release.outputs.created }}
          GH_RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          {
            printf "## Release\n\n"
            printf -- "- Package: \`%s@%s\`\n" "$PACKAGE_NAME" "$PACKAGE_VERSION"
            printf -- "- Tag: \`%s\`\n" "$RELEASE_TAG"
            printf -- "- npm already published before this run: %s\n" "$NPM_ALREADY_PUBLISHED"
            printf -- "- npm publish step result: %s\n" "${NPM_PUBLISH_RESULT:-skipped}"
            printf -- "- GitHub release created in this run: %s\n" "$GH_RELEASE_CREATED"
            printf -- "- GitHub release: %s\n" "$GH_RELEASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
